<!DOCTYPE html>
<html lang="en-AU">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Paddockside</title>
    <base href="/" />
    <link rel="preload" href="fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="_content/Paddockside.Design/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <p class="p-8 text-center text-text-muted" role="status">Loading Paddockside…</p>
    </div>

    <div id="blazor-error-ui" role="alert">
        Something went wrong.
        <a href="." class="reload">Reload the page</a>
    </div>
    <script>
        // Theme override: "light" or "dark" pins the colours; "system" follows the device (tokens.css).
        window.paddockside = {
            setTheme(theme) {
                if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
                else delete document.documentElement.dataset.theme;
            },
            // A phone or tablet: staff can say it's their own when they sign in.
            isTouch() { return matchMedia('(pointer: coarse)').matches; },
            // Back to this tab (or the app, on a phone): has Paddockside been updated since? (BuildCheck)
            onReturn(check) {
                const look = () => { if (document.visibilityState === 'visible') check.invokeMethodAsync('LookAsync'); };
                document.addEventListener('visibilitychange', look);
                window.addEventListener('pageshow', look);
            },
            // Refreshed once for each new build, so a copy kept somewhere in between can't ask for ever.
            refreshFor(build) {
                try { sessionStorage.setItem('refreshed-for', build); } catch { /* private window: it may ask again */ }
                location.reload();
            },
            refreshedFor() {
                try { return sessionStorage.getItem('refreshed-for'); } catch { return null; }
            },
            back() {
                if (history.length > 1) history.back();
                else location.assign('./');
            },
            // Owner portal: a notification link lands on the exact item (identity-access.md §4.1).
            scrollToItem(id) {
                const item = document.getElementById(id);
                if (!item) return false;
                item.scrollIntoView({ block: 'start' });
                item.focus({ preventScroll: true });
                return true;
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
